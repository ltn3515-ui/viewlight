<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ViewLight - AI 추천 조명 큐레이션</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>
<body>
  <div id="cursor-dot"></div>
  <div id="cursor-glow"></div>

  <div class="app-container">
    <header class="mobile-header">
      <div class="header-left">
        <a href="index.html" class="brand-logo-small">ViewLight</a>
      </div>
      <div class="header-title">AI 조명 큐레이션</div>
    </header>

    <main class="main-content" style="padding: 20px; text-align: center;">
      <h2 style="font-size: 1.5rem; margin-bottom: 12px; color: var(--color-text-main);">✨ 당신만을 위한 AI 앰비언트 추천</h2>
      <p style="color: var(--color-text-sub); margin-bottom: 24px;">공간의 분위기와 조도를 실시간으로 분석하여 최적의 무드등을 추천해 드립니다.</p>
      
      <div class="recommend-card-box" style="background: rgba(255,255,255,0.05); padding: 24px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.1);">
        <img src="img/Stand03.png" alt="추천 조명" style="max-width: 200px; margin-bottom: 16px;">
        <h3 style="font-size: 1.2rem; color: #FFAB40;">Aura Mood Light</h3>
        <p style="font-size: 0.9rem; color: #94A3B8; margin-top: 8px;">따뜻한 워톤 감성 라이트 (할인 적용가: 180,000원)</p>
      </div>

      <div style="margin-top: 30px;">
        <a href="index.html" class="btn btn-primary" style="display: inline-block; padding: 12px 24px; text-decoration: none;">홈으로 돌아가기</a>
      </div>
    </main>
  </div>

  <script src="cursor.js"></script>
  <script src="script.js"></script>
</body>
</html>
